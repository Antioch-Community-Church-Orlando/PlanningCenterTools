[project]
name = "planning-center-tools"
version = "1.0.0"
description = "Python CLI tools to automate Planning Center processes via the PCO API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pypco>=1.2.0",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
]

[project.scripts]
pct = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pco", "services", "people"]
